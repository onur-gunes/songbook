<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>songbook e2e</title>
</head>
<body>
<iframe id="f" src="../index.html?nosw" style="width:1100px;height:900px;border:0"></iframe>
<pre id="log"></pre>
<script>
const log = [];
function ok(name, cond, detail) {
    log.push((cond ? 'PASS ' : 'FAIL ') + name + (detail !== undefined ? ' | ' + detail : ''));
}
const frame = document.getElementById('f');
const win = () => frame.contentWindow;
const doc = () => frame.contentDocument;
const $ = id => doc().getElementById(id);
const scrollLabel = () => $('scrollBtn').getAttribute('aria-label');
const rows = () => doc().querySelectorAll('#songList .song-row');
const titles = () => Array.from(rows()).map(r => r.querySelector('.row-title').textContent);
const wait = ms => new Promise(r => setTimeout(r, ms));
async function until(fn, timeout = 8000) {
    const t0 = Date.now();
    while (Date.now() - t0 < timeout) {
        try { if (fn()) return true; } catch (e) { /* keep polling */ }
        await wait(50);
    }
    return false;
}

async function main() {
    // The iframe may already be loaded when this runs (a warm cache can beat
    // the script), so do not wait for a load event that has already fired.
    await new Promise(r => {
        if (frame.contentDocument && frame.contentDocument.readyState === 'complete') r();
        else frame.addEventListener('load', r);
    });
    const ready = await until(() => rows().length === 198);
    if (!ready) { ok('app booted (198 rows)', false, 'rows=' + rows().length); throw new Error('app did not boot'); }

    const errors = [];
    win().addEventListener('error', e => errors.push(String(e.message)));

    // 1. list renders
    ok('198 rows', rows().length === 198, rows().length);
    ok('resultCount', $('resultCount').textContent === '198 songs', $('resultCount').textContent);
    ok('first row alphabetical by title', titles()[0] === "(I Can't Get No) Satisfaction", titles()[0]);
    ok('row has level badge', !!rows()[0].querySelector('.row-level'));

    // 2. search
    $('search').value = 'ript';
    $('search').dispatchEvent(new (win().Event)('input'));
    await wait(50);
    ok('search ript -> 1 row', rows().length === 1, rows().length);
    ok('search ript -> Riptide', titles()[0] === 'Riptide', titles()[0]);

    $('search').value = 'vance';
    $('search').dispatchEvent(new (win().Event)('input'));
    await wait(50);
    ok('search vance (artist) -> 1 row', rows().length === 1, rows().length);

    $('search').value = 'rolling';
    $('search').dispatchEvent(new (win().Event)('input'));
    await wait(50);
    ok('search rolling -> 2 rows', rows().length === 2, rows().length);

    $('search').value = 'zzzzz';
    $('search').dispatchEvent(new (win().Event)('input'));
    await wait(50);
    ok('no match -> empty state', !$('emptyState').hidden && rows().length === 0);
    $('searchClear').click();
    await wait(50);
    ok('clear search -> 198 rows', rows().length === 198, rows().length);

    // 3. filters (levels are multi-select OR toggles)
    const click = lv => doc().querySelector('.filter-btn[data-level="' + lv + '"]').click();
    click('Easy'); await wait(50);
    ok('filter Easy -> 84', rows().length === 84, rows().length);
    click('Medium'); await wait(50);
    ok('filter Easy+Medium -> 175', rows().length === 175, rows().length);
    ok('multi-select active states',
        doc().querySelector('[data-level="Easy"]').getAttribute('aria-pressed') === 'true' &&
        doc().querySelector('[data-level="Medium"]').getAttribute('aria-pressed') === 'true' &&
        doc().querySelector('[data-level="All"]').getAttribute('aria-pressed') === 'false');
    click('Medium'); await wait(50);
    ok('deselect Medium -> 84', rows().length === 84, rows().length);
    click('Hard'); await wait(50);
    ok('filter Easy+Hard -> 107', rows().length === 107, rows().length);
    click('All'); await wait(50);
    ok('All clears levels -> 198', rows().length === 198, rows().length);

    click('New'); await wait(50);
    ok('toggle New -> 18', rows().length === 18, rows().length);
    click('New'); await wait(50);
    ok('untoggle New -> 198', rows().length === 198, rows().length);

    // 4. favorites flow
    const star = doc().querySelector('#songList .song-row .star-btn');
    star.click(); await wait(50);
    ok('star adds fav', star.classList.contains('on'));
    click('Favorites'); await wait(50);
    ok('Favorites filter -> 1', rows().length === 1, rows().length);
    click('Favorites'); await wait(50);
    ok('Favorites off -> 198', rows().length === 198, rows().length);

    // 5. sort buttons (default: Title, alphabetical like the original site)
    ok('title sort active by default', doc().querySelector('[data-sort="title"]').getAttribute('aria-pressed') === 'true');
    const t = titles();
    ok('title sort strips emoji', !t[0].startsWith('🔥') && !t[0].startsWith('🎂'), t[0]);
    ok('title sort not starting with The', !/^the /i.test(t[0]), t[0]);
    const stripped = t.map(x => x.replace(/^[🔥🎂\s]+/, '').replace(/^The\s+/i, ''));
    const sortedCopy = stripped.slice().sort((a, b) => a.localeCompare(b, 'en', { sensitivity: 'base' }));
    ok('title sort ordering', JSON.stringify(stripped) === JSON.stringify(sortedCopy), stripped.slice(0, 3).join(' / '));
    ok('19-2000 intact', t.some(x => x === '19-2000'), t.filter(x => x.startsWith('19')).join(','));

    doc().querySelector('[data-sort="artist"]').click();
    await wait(50);
    const arts = Array.from(rows()).map(r => r.querySelector('.row-artist').textContent);
    const artsSorted = arts.slice().sort((a, b) => a.localeCompare(b, 'en', { sensitivity: 'base' }));
    ok('artist sort ordering', JSON.stringify(arts) === JSON.stringify(artsSorted), arts[0] + ' .. ' + arts[arts.length - 1]);
    ok('artist sort button active',
        doc().querySelector('[data-sort="artist"]').getAttribute('aria-pressed') === 'true' &&
        doc().querySelector('[data-sort="title"]').getAttribute('aria-pressed') === 'false');

    doc().querySelector('[data-sort="title"]').click();
    await wait(50);
    ok('back to title sort', titles()[0] === t[0], titles()[0]);

    // 6. open song via hash
    win().location.hash = '#/krakow-ukulele/riptide';
    await wait(200);
    ok('song view shown', $('songView').hidden === false && $('listView').hidden === true);
    ok('song title', $('songTitle').textContent === 'Riptide', $('songTitle').textContent);
    ok('song number', $('songNumber').textContent === '#166' || $('songNumber').textContent.startsWith('#'), $('songNumber').textContent);
    ok('sheet has lines', doc().querySelectorAll('#sheet .line').length > 10, doc().querySelectorAll('#sheet .line').length);
    ok('chord strip has items', doc().querySelectorAll('#chordStrip .chord-item').length > 0, doc().querySelectorAll('#chordStrip .chord-item').length);
    const firstChordSrc = doc().querySelector('#chordStrip img') ? doc().querySelector('#chordStrip img').getAttribute('src') : null;
    ok('first chord img src', firstChordSrc === null || firstChordSrc.indexOf('data:image') === 0, firstChordSrc && firstChordSrc.slice(0, 40));

    // 7. transpose
    const firstChord = () => { const s = doc().querySelector('#sheet .seg-chord'); return s ? s.textContent : null; };
    const before = firstChord();
    $('trUp').click(); await wait(30);
    ok('transpose +1 label', $('trValue').textContent === '+1', $('trValue').textContent);
    ok('transpose changes chord', firstChord() !== before, before + ' -> ' + firstChord());
    const up1 = firstChord();
    $('trUp').click(); await wait(30);
    ok('transpose +2', $('trValue').textContent === '+2' && firstChord() !== up1, firstChord());
    for (let i = 0; i < 2; i++) { $('trDown').click(); await wait(20); }
    ok('transpose back to 0', $('trValue').textContent === '0' && firstChord() === before, firstChord());
    // 7b. chord strip diagrams + names follow transpose
    const names0 = Array.from(doc().querySelectorAll('#chordStrip .cname')).map(c => c.textContent);
    const srcs0 = Array.from(doc().querySelectorAll('#chordStrip img')).map(i => i.getAttribute('src'));
    ok('strip shows original chords', names0.join(',') === 'Am,G,C,F', names0.join(','));
    $('trUp').click(); $('trUp').click(); await wait(50);
    const names2 = Array.from(doc().querySelectorAll('#chordStrip .cname')).map(c => c.textContent);
    const srcs2 = Array.from(doc().querySelectorAll('#chordStrip img')).map(i => i.getAttribute('src'));
    ok('strip transposes names', names2.join(',') === 'Bm,A,D,G', names2.join(','));
    ok('strip transposes diagrams', srcs2.length === 4 && srcs2.every((s, i) => s !== srcs0[i]), srcs2.join(',').slice(0, 60));
    $('trDown').click(); $('trDown').click(); await wait(50);
    ok('strip restores at 0', Array.from(doc().querySelectorAll('#chordStrip .cname')).map(c => c.textContent).join(',') === names0.join(','), '');
    $('trUp').click(); $('trUp').click(); $('trUp').click(); await wait(400);
    const names3 = Array.from(doc().querySelectorAll('#chordStrip .cname')).map(c => c.textContent);
    ok('strip +3 names', names3.join(',') === 'Cm,Bb,D#,G#', names3.join(','));
    ok('strip +3 no missing via enharmonic', doc().querySelectorAll('#chordStrip .missing').length === 0 && doc().querySelectorAll('#chordStrip img').length === 4, 'missing=' + doc().querySelectorAll('#chordStrip .missing').length + ' imgs=' + doc().querySelectorAll('#chordStrip img').length);
    $('trDown').click(); $('trDown').click(); $('trDown').click(); await wait(50);
    ok('strip back to 0 after +3', $('trValue').textContent === '0', '');

    // 7c. generated diagrams cover transposed chords with no native gif (a little respect +1)
    win().location.hash = '#/krakow-ukulele/a-little-respect';
    await wait(300);
    $('trUp').click(); await wait(500);
    const namesR = Array.from(doc().querySelectorAll('#chordStrip .cname')).map(n => n.textContent);
    ok('respect +1 names', namesR.join(',') === 'C#,C#sus4,G#,F7,F#,Bbm,Fm,B', namesR.join(','));
    ok('respect +1 no missing', doc().querySelectorAll('#chordStrip .missing').length === 0, 'missing=' + doc().querySelectorAll('#chordStrip .missing').length);
    const genImgs = Array.from(doc().querySelectorAll('#chordStrip img')).filter(i => (i.getAttribute('src') || '').indexOf('data:image/svg+xml') === 0);
    ok('generated svg diagrams used', genImgs.length >= 3, genImgs.length);
    ok('generated charts valid', genImgs.length >= 3 && genImgs.every(i => i.complete && i.naturalWidth > 0), genImgs.map(i => i.naturalWidth).join(','));
    $('trDown').click(); await wait(50);
    ok('respect back to 0', $('trValue').textContent === '0' && Array.from(doc().querySelectorAll('#chordStrip .cname')).map(n => n.textContent).join(',') === 'C,Csus4,G,E7,F,Am,Em,Bb', '');

    // 7d. every chart is a generated svg + click opens a voicing chooser
    const sdAll = Array.from(doc().querySelectorAll('#chordStrip img'));
    ok('all strip charts generated svg', sdAll.length === 8 && sdAll.every(i => (i.getAttribute('src') || '').indexOf('data:image/svg+xml') === 0), sdAll.length);
    const cTgt = Array.from(doc().querySelectorAll('#chordStrip .chord-item')).find(it => it.querySelector('.cname').textContent === 'C');
    const cBefore = cTgt.querySelector('img').getAttribute('src');
    cTgt.click(); await wait(80);
    ok('chooser opens on chord click', doc().querySelector('#voicingChooser') !== null, '');
    const cOpts = Array.from(doc().querySelectorAll('#voicingChooser .chooser-grid button'));
    ok('chooser lists multiple voicings', cOpts.length > 2, cOpts.length);
    ok('current voicing marked selected', doc().querySelectorAll('#voicingChooser button.sel').length === 1, '');
    cOpts[1].click(); await wait(80);
    ok('chooser closes on pick', doc().querySelector('#voicingChooser') === null, '');
    const cAfter = cTgt.querySelector('img').getAttribute('src');
    ok('chord item swaps voicing', cAfter !== cBefore, '');
    ok('pick persisted', win().localStorage.getItem('songbook:pick:ukulele:C') !== null, win().localStorage.getItem('songbook:pick:ukulele:C'));
    cTgt.click(); await wait(80);
    ok('stored voicing selected on reopen', Array.from(doc().querySelectorAll('#voicingChooser button.sel img')).some(i => i.getAttribute('src') === cAfter), '');
    win().location.hash = '#/krakow-ukulele/riptide';
    await wait(250);
    ok('chooser not leaked to other song', doc().querySelector('#voicingChooser') === null && Array.from(doc().querySelectorAll('#chordStrip .cname')).map(n => n.textContent).join(',') === 'Am,G,C,F', '');
    win().location.hash = '#/krakow-ukulele/a-little-respect';
    await wait(300);
    const cBack = Array.from(doc().querySelectorAll('#chordStrip .chord-item')).find(it => it.querySelector('.cname').textContent === 'C').querySelector('img').getAttribute('src');
    ok('voicing remembered across songs', cBack === cAfter, '');
    win().localStorage.removeItem('songbook:pick:ukulele:C');
    // rail chords stay put: stop/pause/muted never change (riff check on a known song later)

    // 7e. classic open-position voicings rank first
    win().location.hash = '#/krakow-ukulele/black';
    await wait(300);
    let eTarget = Array.from(doc().querySelectorAll('#chordStrip .chord-item')).find(it => it.querySelector('.cname').textContent === 'E');
    eTarget.click(); await wait(80);
    const eRanks = Array.from(doc().querySelectorAll('#voicingChooser .choosing-frets')).map(x => x.textContent.replace(/\s+/g, '').replace(/o/g, '0'));
    ok('E default is classic open 1402', eRanks[0] === '1402', eRanks[0]);
    ok('E second option boosted to easy 1x02', eRanks[1] === '1x02', eRanks[1]);
    ok('easy option flagged', doc().querySelectorAll('#voicingChooser button.easy').length === 1, doc().querySelectorAll('#voicingChooser button.easy').length);
    const hardNames = Array.from(doc().querySelectorAll('#chordStrip .chord-item.hard .cname')).map(c => c.textContent);
    ok('E marked hard', hardNames.includes('E'), hardNames.join(','));
    ok('Em not marked', !hardNames.includes('Em'), hardNames.join(','));
    doc().querySelector('.chooser-close').click(); await wait(50);
    win().location.hash = '#/krakow-ukulele/500-miles-i-m-gonna-be';
    await wait(300);
    let emTarget = Array.from(doc().querySelectorAll('#chordStrip .chord-item')).find(it => it.querySelector('.cname').textContent === 'Em');
    emTarget.click(); await wait(80);
    const emRanks = Array.from(doc().querySelectorAll('#voicingChooser .choosing-frets')).map(x => x.textContent.replace(/\s+/g, '').replace(/o/g, '0'));
    ok('Em default is classic open 0432', emRanks[0] === '0432', emRanks[0]);
    doc().querySelector('.chooser-close').click(); await wait(50);

    // 8. NC renders as Chuck (muted voicing) in the strip, not as a missing diagram
    win().location.hash = '#/krakow-ukulele/home';
    await wait(400);
    const chuckItems = doc().querySelectorAll('#chordStrip .chord-item.chuck');
    ok('NC renders as Chuck in strip', chuckItems.length >= 1 && Array.from(chuckItems).some(it => it.querySelector('.cname').textContent === 'Chuck'), 'chuck=' + chuckItems.length);

    // 9. prev/next respect sort/filter (default: title order)
    win().location.hash = '#/krakow-ukulele/riptide';
    await wait(200);
    const numNow = $('songNumber').textContent;
    $('nextBtn').click(); await wait(200);
    const numNext = $('songNumber').textContent;
    ok('next goes forward', numNext !== numNow, numNow + ' -> ' + numNext);
    $('prevBtn').click(); await wait(200);
    ok('prev returns', $('songNumber').textContent === numNow);

    // 10. notes persist
    $('notesBox').value = 'test note 123';
    $('notesSave').click(); await wait(50);
    ok('notes status shown', $('notesStatus').classList.contains('show'));
    ok('notes in localStorage', (win().localStorage.getItem('songbook:note:krakow-ukulele\u0000riptide') || '') === 'test note 123');

    // 11. favorite from song view
    $('favBtn').click(); await wait(50);
    ok('fav button on', $('favBtn').classList.contains('on'));
    ok('fav in localStorage', (win().localStorage.getItem('songbook:favorites') || '').indexOf('riptide') > -1);
    $('favBtn').click(); await wait(50);
    ok('fav toggles off', !$('favBtn').classList.contains('on'));

    // 12. auto-scroll starts/pauses without throwing
    ok('floating scroll button visible in song view', $('scrollBtn').getClientRects().length > 0);
    win().scrollTo(0, 0);
    await wait(80);
    $('scrollBtn').click(); await wait(300);
    ok('no jump on start', win().pageYOffset < 30, 'y=' + win().pageYOffset);
    ok('scroll playing label', scrollLabel() === 'Pause auto-scroll', scrollLabel());
    ok('playing state styled', $('scrollBtn').classList.contains('playing'));
    const y1 = win().pageYOffset;
    $('scrollBtn').click(); await wait(100);
    ok('scroll pauses', scrollLabel() === 'Resume auto-scroll', scrollLabel());
    $('scrollReset').click(); await wait(50);
    ok('scroll resets', scrollLabel() === 'Start auto-scroll', scrollLabel());

    // 12b. manual adjust keeps auto-scroll running, re-anchored to the new position
    $('scrollBtn').click(); await wait(200);
    ok('playing before adjust', scrollLabel() === 'Pause auto-scroll', scrollLabel());
    const st = win().songbookTest.scrollState;
    const v0 = win().songbookTest.targetVel();
    const yBefore = win().pageYOffset;
    win().scrollBy(0, 400);
    ok('manual scroll moved page', win().pageYOffset >= yBefore + 300, yBefore + ' -> ' + win().pageYOffset);
    // headless virtual-time never dispatches scroll events; deliver one as a browser would
    win().dispatchEvent(new (win().Event)('scroll'));
    await wait(50);
    ok('keeps scrolling after manual adjust', scrollLabel() === 'Pause auto-scroll', scrollLabel());
    ok('re-anchored to adjusted position', Math.abs(st.pos - win().pageYOffset) < 40, 'pos=' + st.pos + ' y=' + win().pageYOffset);
    const posAfterAdjust = st.pos;
    await wait(120);
    ok('scroll keeps advancing after adjust', st.pos > posAfterAdjust, posAfterAdjust + ' -> ' + st.pos);
    const v1 = win().songbookTest.targetVel();
    ok('scroll speed preserved after adjust', Math.abs(v1 - v0) / v0 < 0.05, v0.toFixed(3) + ' -> ' + v1.toFixed(3));
    $('speedUp').click(); await wait(50);
    const v2 = win().songbookTest.targetVel();
    ok('speed change takes effect after manual adjust', v2 > v1, v1.toFixed(4) + ' -> ' + v2.toFixed(4));
    $('speedDown').click(); await wait(50);
    win().scrollBy(0, -150);
    win().dispatchEvent(new (win().Event)('scroll'));
    await wait(50);
    ok('upward adjust keeps playing', scrollLabel() === 'Pause auto-scroll', scrollLabel());
    ok('re-anchored upward', Math.abs(st.pos - win().pageYOffset) < 40, 'pos=' + st.pos + ' y=' + win().pageYOffset);
    $('scrollBtn').click(); await wait(50);
    ok('pause after adjust', scrollLabel() === 'Resume auto-scroll', scrollLabel());
    $('scrollBtn').click(); await wait(50);
    ok('resume after adjust', scrollLabel() === 'Pause auto-scroll', scrollLabel());
    $('scrollReset').click(); await wait(50);

    // 12c. speed stepper: fine-grained control with clamps
    const s0 = parseFloat($('speedValue').textContent);
    ok('speed initial parses', !isNaN(s0), $('speedValue').textContent);
    $('speedUp').click();
    ok('speed +0.1', parseFloat($('speedValue').textContent) === +(s0 + 0.1).toFixed(1), $('speedValue').textContent);
    $('speedDown').click(); $('speedDown').click();
    ok('speed -0.1 twice', parseFloat($('speedValue').textContent) === +(s0 - 0.1).toFixed(1), $('speedValue').textContent);
    for (let i = 0; i < 30; i++) $('speedDown').click();
    ok('speed clamps low', $('speedValue').textContent === '0.2×', $('speedValue').textContent);
    for (let i = 0; i < 40; i++) $('speedUp').click();
    ok('speed clamps high', $('speedValue').textContent === '3.0×', $('speedValue').textContent);
    ok('speed persisted', win().localStorage.getItem('songbook:speed:krakow-ukulele\u0000riptide') === '3', win().localStorage.getItem('songbook:speed:krakow-ukulele\u0000riptide'));
    for (let i = 0; i < 50 && parseFloat($('speedValue').textContent) > s0; i++) $('speedDown').click();
    for (let i = 0; i < 50 && parseFloat($('speedValue').textContent) < s0; i++) $('speedUp').click();
    ok('speed restored', parseFloat($('speedValue').textContent) === s0, $('speedValue').textContent);

    // 12d. per-song speed is remembered individually (default 1.0× when unset)
    const savedRiptide = parseFloat($('speedValue').textContent);
    win().location.hash = '#/krakow-ukulele/all-apologies';
    await wait(250);
    ok('per-song default speed 1.0', $('speedValue').textContent === '1.0×', $('speedValue').textContent);
    $('speedUp').click(); $('speedUp').click();
    ok('song b speed changed', $('speedValue').textContent === '1.2×', $('speedValue').textContent);
    win().location.hash = '#/krakow-ukulele/riptide';
    await wait(250);
    ok('song a speed remembered', parseFloat($('speedValue').textContent) === savedRiptide, $('speedValue').textContent + ' vs ' + savedRiptide);
    win().location.hash = '#/krakow-ukulele/all-apologies';
    await wait(250);
    ok('song b speed remembered', $('speedValue').textContent === '1.2×', $('speedValue').textContent);

    // 12e. per-song text size (default 100%)
    const baseSize = parseFloat(win().getComputedStyle($('sheet')).fontSize);
    ok('size default 100%', $('sizeValue').textContent === '100%', $('sizeValue').textContent);
    $('sizeDown').click(); await wait(50);
    ok('size smaller', $('sizeValue').textContent === '90%', $('sizeValue').textContent);
    ok('size applied smaller', parseFloat(win().getComputedStyle($('sheet')).fontSize) < baseSize, parseFloat(win().getComputedStyle($('sheet')).fontSize));
    $('sizeUp').click(); $('sizeUp').click();
    ok('size bigger', $('sizeValue').textContent === '110%', $('sizeValue').textContent);
    ok('size applied bigger', parseFloat(win().getComputedStyle($('sheet')).fontSize) > baseSize, parseFloat(win().getComputedStyle($('sheet')).fontSize));
    for (let i = 0; i < 20; i++) $('sizeDown').click();
    ok('size clamps low', $('sizeValue').textContent === '70%', $('sizeValue').textContent);
    for (let i = 0; i < 20; i++) $('sizeUp').click();
    ok('size clamps high', $('sizeValue').textContent === '150%', $('sizeValue').textContent);
    ok('size persisted', win().localStorage.getItem('songbook:size:krakow-ukulele\u0000all-apologies') === '1.5', win().localStorage.getItem('songbook:size:krakow-ukulele\u0000all-apologies'));
    win().location.hash = '#/krakow-ukulele/riptide';
    await wait(250);
    ok('per-song size default for other song', $('sizeValue').textContent === '100%', $('sizeValue').textContent);
    win().location.hash = '#/krakow-ukulele/all-apologies';
    await wait(250);
    ok('per-song size remembered', $('sizeValue').textContent === '150%', $('sizeValue').textContent);

    // 12f. pinch over the sheet adjusts text size, per song
    win().location.hash = '#/krakow-ukulele/riptide';
    await wait(250);
    ok('pinch starting size 100', $('sizeValue').textContent === '100%', $('sizeValue').textContent);
    const pev = (type, id, x, y) => new (win().PointerEvent)(type, { pointerId: id, pointerType: 'touch', bubbles: true, cancelable: true, clientX: x, clientY: y });
    $('sheet').dispatchEvent(pev('pointerdown', 21, 100, 300));
    $('sheet').dispatchEvent(pev('pointerdown', 22, 300, 300));
    $('sheet').dispatchEvent(pev('pointermove', 22, 360, 300));
    ok('pinch out grows text', $('sizeValue').textContent === '110%', $('sizeValue').textContent);
    $('sheet').dispatchEvent(pev('pointermove', 22, 150, 300));
    ok('pinch in shrinks text', $('sizeValue').textContent === '100%', $('sizeValue').textContent);
    $('sheet').dispatchEvent(pev('pointerup', 21, 100, 300));
    $('sheet').dispatchEvent(pev('pointerup', 22, 150, 300));
    $('sheet').dispatchEvent(pev('pointermove', 22, 160, 300));
    ok('pinch ignores moves after release', $('sizeValue').textContent === '100%', $('sizeValue').textContent);
    ok('pinch size persisted', win().localStorage.getItem('songbook:size:krakow-ukulele\u0000riptide') === '1', win().localStorage.getItem('songbook:size:krakow-ukulele\u0000riptide'));
    $('sizeUp').click(); await wait(30);
    ok('stepper and pinch share the same state', $('sizeValue').textContent === '110%', $('sizeValue').textContent);
    $('sizeDown').click(); await wait(30);

    for (let i = 0; i < 20; i++) $('strumSizeDown').click();
    await wait(50);
    ok('size clamps at 60%', win().songbookTest.getStrumSize() === 0.6,
        win().songbookTest.getStrumSize());
    win().songbookTest.setStrumSize(1);
    await wait(50);

    // pinned by default and stacked UNDER the chord strip, not over it
    ok('row is sticky by default', win().getComputedStyle(sRow()).position === 'sticky',
        win().getComputedStyle(sRow()).position);
    ok('pin button pressed by default', $('strumPinBtn').getAttribute('aria-pressed') === 'true');
    ok('row sits below the pinned chord strip',
        Math.abs(rowTop() - (56 + Math.round(stripH()))) <= 1,
        'top=' + rowTop() + ' strip=' + Math.round(stripH()));

    // the offset tracks the strip: bigger diagrams push the row down
    const topBefore = rowTop();
    $('chordSizeUp').click();
    await wait(120);
    ok('row follows the strip when diagrams grow', rowTop() > topBefore,
        topBefore + ' -> ' + rowTop());
    $('chordSizeDown').click();
    await wait(120);

    // unpinning the strip removes it from the sticky stack, so the row rises
    $('chordPinBtn').click();
    await wait(120);
    ok('row rises when the chord strip is unpinned', Math.abs(rowTop() - 56) <= 1, rowTop());
    $('chordPinBtn').click();
    await wait(120);

    // unpinning the row itself drops it out of the sticky stack
    $('strumPinBtn').click();
    await wait(50);
    ok('unpinned row is static', win().getComputedStyle(sRow()).position === 'static',
        win().getComputedStyle(sRow()).position);
    ok('pin button reflects unpinned', $('strumPinBtn').getAttribute('aria-pressed') === 'false' &&
        $('strumPinBtn').textContent === '\ud83d\udccd', $('strumPinBtn').textContent);
    ok('pin persisted', win().localStorage.getItem('songbook:strumPin') === '0',
        win().localStorage.getItem('songbook:strumPin'));

    // both are global preferences: they survive a song change, like chordSize
    win().location.hash = '#/polska-gurom/autobiografia';
    await wait(300);
    ok('pin preference carries across songs', win().songbookTest.getStrumPin() === false,
        String(win().songbookTest.getStrumPin()));
    ok('row still static on the next song', win().getComputedStyle(sRow()).position === 'static',
        win().getComputedStyle(sRow()).position);

    $('strumPinBtn').click();
    await wait(50);
    ok('repinned', win().getComputedStyle(sRow()).position === 'sticky',
        win().getComputedStyle(sRow()).position);
    win().localStorage.removeItem('songbook:strumSize');
    win().localStorage.removeItem('songbook:strumPin');

    win().localStorage.removeItem('songbook:strum:polska-gurom\u0000arahja');
    win().localStorage.removeItem('songbook:bpm:polska-gurom\u0000arahja');

    // 20c. play-along grid chart (issue #44)
    const gridBtn = () => doc().querySelector('.chord-mode-btn[data-chord-mode="grid"]');
    const gridSheet = () => doc().querySelector('.sheet.chords-grid');
    const gridBeatEls = () => doc().querySelectorAll('.sheet.chords-grid .grid-beat');
    const gridInfo = () => win().songbookTest.gridInfo();
    const firstGridLabel = () => {
        const el = doc().querySelector('.sheet.chords-grid .grid-chord');
        return el ? el.textContent : '';
    };

    // The grid data lives in the Popular Songs book (the default Krakow book
    // has none), so start there.
    win().localStorage.removeItem('songbook:chordMode');
    win().location.hash = '#/popular/stand-by-me';
    await wait(350);
    ok('grid button enabled for a song with a grid', !!gridBtn() && gridBtn().disabled === false);
    ok('mode starts inline', win().songbookTest.getChordMode() === 'inline',
        win().songbookTest.getChordMode());

    gridBtn().click();
    await wait(150);
    ok('grid mode selected', win().songbookTest.getChordMode() === 'grid',
        win().songbookTest.getChordMode());
    ok('grid mode persisted', win().localStorage.getItem('songbook:chordMode') === 'grid',
        win().localStorage.getItem('songbook:chordMode'));
    ok('grid sheet rendered', !!gridSheet());

    const gBars = doc().querySelectorAll('.sheet.chords-grid .grid-bar');
    const gBeats = gridBeatEls();
    const gDiagrams = doc().querySelectorAll('.sheet.chords-grid .grid-diagram');
    ok('grid renders one bar per grid bar', gBars.length === 8, gBars.length);
    ok('grid renders one slash per beat', gBeats.length === 32, gBeats.length);
    ok('grid renders a diagram above each chord change', gDiagrams.length === 8, gDiagrams.length);
    // A chord diagram must look like the others: same grid lines and same
    // rendered box, not a taller or smaller shape for one chord.
    const gShape = img => {
        const src = img.getAttribute('src') || '';
        const svg = decodeURIComponent(src.split(',')[1] || '');
        return (svg.match(/class="st"/g) || []).length + 's/' +
            (svg.match(/class="fw"/g) || []).length + 'f';
    };
    const gShapes = [].map.call(gDiagrams, gShape);
    const gBoxes = [].map.call(gDiagrams, img => {
        const r = img.getBoundingClientRect();
        return Math.round(r.width) + 'x' + Math.round(r.height);
    });
    ok('every grid diagram has the same string and fret lines',
        gShapes.length > 0 && gShapes.every(s => s === gShapes[0]),
        [...new Set(gShapes)].join(' '));
    ok('every grid diagram renders at one size',
        gBoxes.length > 0 && gBoxes.every(b => b === gBoxes[0]),
        [...new Set(gBoxes)].join(' '));
    ok('grid draws bar lines',
        win().getComputedStyle(gBars[0]).borderLeftWidth === '1px',
        win().getComputedStyle(gBars[0]).borderLeftWidth);
    ok('grid shows the section label beneath the system',
        doc().querySelector('.sheet.chords-grid .grid-section-label').textContent === 'Verse/Chorus',
        doc().querySelector('.sheet.chords-grid .grid-section-label').textContent);

    const gInfo = gridInfo();
    ok('grid info matches the song data',
        gInfo && gInfo.totalBeats === 32 && gInfo.beatsPerBar === 4 && gInfo.bpm === 118,
        JSON.stringify(gInfo));

    // Lyrics are laid out one row per chord change (one line per phrase), so
    // no column is empty and a chord never gets two lines. Words are kept
    // whole even when a change falls inside them ("West Vir"+"ginia").
    const gridLyrics = () => doc().querySelectorAll('.sheet.chords-grid .grid-lyric');
    ok('grid shows one lyric row per chord change', gridLyrics().length === 5, gridLyrics().length);
    ok('grid picks the section whose changes match exactly',
        gInfo && gInfo.lyricSection === 'Chorus', gInfo && gInfo.lyricSection);
    ok('first lyric row starts at the first chord change',
        gridLyrics()[0] && gridLyrics()[0].textContent === 'So darling, darling, stand by me',
        gridLyrics()[0] && gridLyrics()[0].textContent);
    const gFirstBar = doc().querySelector('.sheet.chords-grid .grid-bar');
    ok('lyrics sit below the bars',
        !!gFirstBar && !!gridLyrics()[0] &&
        gridLyrics()[0].getBoundingClientRect().top >= gFirstBar.getBoundingClientRect().bottom - 1,
        gFirstBar && gridLyrics()[0] &&
        (gridLyrics()[0].getBoundingClientRect().top - gFirstBar.getBoundingClientRect().bottom).toFixed(1));
    const gFirstSystem = doc().querySelector('.sheet.chords-grid .grid-system');
    ok('lyric layer reserves vertical space',
        !!gFirstSystem && parseFloat(gFirstSystem.style.paddingBottom) > 0,
        gFirstSystem && gFirstSystem.style.paddingBottom);
    const gFirstChange = doc().querySelector('.sheet.chords-grid .grid-change');
    ok('lyric aligns with its chord change',
        !!gFirstChange && !!gridLyrics()[0] &&
        Math.abs(gridLyrics()[0].getBoundingClientRect().left -
                 gFirstChange.getBoundingClientRect().left) < 1,
        gFirstChange && gridLyrics()[0] &&
        (gridLyrics()[0].getBoundingClientRect().left - gFirstChange.getBoundingClientRect().left).toFixed(1));
    // The column is sized from the lyric phrase, not only the diagram: this
    // line is longer than a plain beat column, so its bar must grow to hold it.
    const gFirstPhraseRow = doc().querySelector('.sheet.chords-grid .grid-lyric');
    ok('grid widens a chord column to fit its lyric phrase',
        !!gFirstBar && !!gFirstPhraseRow &&
        gFirstBar.getBoundingClientRect().width >=
            gFirstPhraseRow.getBoundingClientRect().width + 9,
        gFirstBar && gFirstPhraseRow &&
        (gFirstBar.getBoundingClientRect().width -
         gFirstPhraseRow.getBoundingClientRect().width).toFixed(1));

    // The cursor is a pure function of the metronome's beat position: one bar
    // of count-in, then one index per beat, then null past the chart.
    const beatAt = win().songbookTest.gridBeatAt;
    ok('count-in maps before the first chart beat', beatAt(0) === -1 && beatAt(3.99) === -1);
    ok('chart beat 0 starts after the count-in', beatAt(4) === 0 && beatAt(4.99) === 0);
    ok('later beats map one per beat', beatAt(5) === 1 && beatAt(35.99) === 31);
    ok('past the last beat maps to null', beatAt(36) === null);

    // Diagrams must use the same stored voicing as the chord strip.
    const gInstr = win().songbookTest.getInstrument();
    let gVoicingOk = true, gVoicingDetail = '';
    doc().querySelectorAll('.sheet.chords-grid .grid-change').forEach(ch => {
        const name = ch.getAttribute('data-chord');
        const v = win().songbookTest.chosenVoicing(name);
        const img = ch.querySelector('img');
        const want = v ? win().songbookTest.ChordKit.dataUri(gInstr, v) : null;
        const got = img ? img.getAttribute('src') : null;
        if (got !== want) {
            gVoicingOk = false;
            gVoicingDetail = name + ' expected ' + (want ? 'diagram' : 'none') + ' got ' + (got ? 'diagram' : 'none');
        }
    });
    ok('grid diagrams use the chosen voicing', gVoicingOk, gVoicingDetail);

    // A stored per-chord pick must reach the chart, not just the strip.
    const aShapes = win().songbookTest.ChordKit.voicings('A', gInstr);
    if (aShapes.length > 1) {
        win().localStorage.setItem('songbook:pick:' + gInstr + ':A', aShapes[1].join(','));
        win().songbookTest.setChordMode('inline');
        await wait(80);
        win().songbookTest.setChordMode('grid');
        await wait(120);
        const aImg = doc().querySelector('.sheet.chords-grid .grid-change[data-chord="A"] img');
        ok('stored voicing pick reaches the grid',
            !!aImg && aImg.getAttribute('src') === win().songbookTest.ChordKit.dataUri(gInstr, aShapes[1]));
        win().localStorage.removeItem('songbook:pick:' + gInstr + ':A');
        win().songbookTest.setChordMode('inline');
        await wait(60);
        win().songbookTest.setChordMode('grid');
        await wait(120);
    }

    // A grid that is a different arrangement must not invent lyrics.
    win().location.hash = '#/popular/the-house-of-the-rising-sun';
    await wait(350);
    ok('grid still renders when the arrangement differs', !!gridSheet());
    ok('no lyrics when the grid does not match the sheet',
        doc().querySelectorAll('.sheet.chords-grid .grid-lyric').length === 0,
        doc().querySelectorAll('.sheet.chords-grid .grid-lyric').length);
    ok('grid info reports no lyric section', gridInfo() && gridInfo().lyricSection === null,
        gridInfo() && gridInfo().lyricSection);

    // Repeat signs are per block. Riptide is the grid song with repeat: true.
    win().location.hash = '#/popular/riptide';
    await wait(350);
    ok('grid mode carries across songs', win().songbookTest.getChordMode() === 'grid',
        win().songbookTest.getChordMode());
    ok('grid re-renders for the new song', doc().querySelectorAll('.grid-bar').length === 4,
        doc().querySelectorAll('.grid-bar').length);
    ok('repeat start sign rendered', doc().querySelector('.sheet.chords-grid .grid-repeat.start') !== null);
    ok('repeat end sign rendered', doc().querySelector('.sheet.chords-grid .grid-repeat.end') !== null);
    ok('looping grid shows one iteration of lyrics', gridLyrics().length === 3, gridLyrics().length);
    ok('looping grid picks the first matching section',
        gridInfo() && gridInfo().lyricSection === 'Verse 1', gridInfo() && gridInfo().lyricSection);
    const rFirstChange = doc().querySelector('.sheet.chords-grid .grid-change');
    ok('lyric aligns past the repeat sign',
        !!rFirstChange && !!gridLyrics()[0] &&
        Math.abs(gridLyrics()[0].getBoundingClientRect().left -
                 rFirstChange.getBoundingClientRect().left) < 1,
        rFirstChange && gridLyrics()[0] &&
        (gridLyrics()[0].getBoundingClientRect().left - rFirstChange.getBoundingClientRect().left).toFixed(1));

    // Transpose and I-V are shared with the other renderers.
    const labelBefore = firstGridLabel();
    $('trUp').click();
    await wait(150);
    const labelUp = firstGridLabel();
    ok('transpose applies to the grid', labelUp !== labelBefore && labelUp !== '',
        labelBefore + ' -> ' + labelUp);
    $('trDown').click();
    await wait(150);
    ok('transpose back restores the grid label', firstGridLabel() === labelBefore,
        firstGridLabel());

    $('numbersBtn').click();
    await wait(150);
    const degreeLabel = firstGridLabel();
    ok('degrees apply to the grid', /^[ivIV]/.test(degreeLabel), degreeLabel);
    ok('degree labels are measured and drawn in the mono face',
        win().getComputedStyle(doc().querySelector('.sheet.chords-grid .grid-chord'))
            .fontFamily.indexOf('mono') > -1,
        win().getComputedStyle(doc().querySelector('.sheet.chords-grid .grid-chord')).fontFamily);
    $('numbersBtn').click();
    await wait(150);
    ok('degrees off restores chord names', firstGridLabel() === labelBefore, firstGridLabel());

    // Cursor: driven by the metronome clock, not a second timer.
    ok('grid duration comes from the beat grid',
        win().songbookTest.gridDurationMs() > 0, win().songbookTest.gridDurationMs());
    for (let i = 0; i < 200 && $('bpmValue').textContent !== '240'; i++) $('bpmUp').click();
    ok('bpm set to 240 for the grid cursor test', $('bpmValue').textContent === '240',
        $('bpmValue').textContent);
    $('metronomeBtn').click();
    await wait(1200);
    ok('metronome running for the grid cursor test', mState().playing === true);

    let gLockOk = true, gLockDetail = '';
    for (let i = 0; i < 14; i++) {
        const pos = win().songbookTest.metronomePosition();
        const on = doc().querySelector('.sheet.chords-grid .grid-beat.on');
        const expect = win().songbookTest.gridBeatAt(pos);
        const got = on ? parseInt(on.dataset.beat, 10) : null;
        if (pos !== null && expect !== null && expect !== -1) {
            // One beat of slack: pos is read a frame after the class is set.
            if (got === null || Math.abs(got - expect) > 1) {
                gLockOk = false;
                gLockDetail = 'pos=' + pos.toFixed(3) + ' expect=' + expect + ' got=' + got;
            }
        }
        await wait(60);
    }
    ok('grid cursor stays locked to the metronome clock', gLockOk, gLockDetail);
    ok('a beat is highlighted while the metronome runs',
        doc().querySelector('.sheet.chords-grid .grid-beat.on') !== null);
    ok('grid phase reports playing', gridInfo() && gridInfo().phase === 'playing',
        gridInfo() && gridInfo().phase);

    $('metronomeBtn').click();
    await wait(100);
    ok('grid cursor cleared when the metronome stops',
        doc().querySelector('.sheet.chords-grid .grid-beat.on') === null);
    ok('grid phase returns to idle', gridInfo() && gridInfo().phase === 'idle',
        gridInfo() && gridInfo().phase);

    // Reflow: the same chart packs into more systems on a phone width and the
    // page itself must not gain a horizontal scrollbar.
    const systemsBefore = doc().querySelectorAll('.sheet.chords-grid .grid-system').length;
    frame.style.width = '380px';
    await wait(400);
    const systemsAfter = doc().querySelectorAll('.sheet.chords-grid .grid-system').length;
    ok('grid reflows on a phone width', systemsAfter > systemsBefore,
        systemsBefore + ' -> ' + systemsAfter);
    ok('grid does not overflow the page on a phone width',
        doc().documentElement.scrollWidth <= 381, doc().documentElement.scrollWidth);
    frame.style.width = '1100px';
    await wait(400);

    // A complete song: the grid walks the whole form — V1, Chorus, V2,
    // Chorus, Bridge, Final Chorus (fading) — with lyrics anchored at each
    // chord change (one iteration per chart, repeat signs on the fade).
    win().location.hash = '#/popular/take-me-home-country-roads';
    await wait(350);
    win().songbookTest.setChordMode('grid');
    await wait(120);
    const thInfo = gridInfo();
    ok('complete song has a full-form grid',
        thInfo && thInfo.totalBeats === 200 && thInfo.beatsPerBar === 4 && thInfo.bpm === 82,
        JSON.stringify(thInfo));
    ok('complete song grid labels every section in order',
        Array.from(doc().querySelectorAll('.sheet.chords-grid .grid-section-label'))
            .map(e => e.textContent).join('|') === 'Verse 1|Chorus|Verse 2|Chorus|Bridge|Final Chorus',
        'see above');
    ok('complete song marks the fading final chorus with repeat signs',
        !!doc().querySelector('.sheet.chords-grid .grid-repeat.start') &&
        !!doc().querySelector('.sheet.chords-grid .grid-repeat.end'));
    // A change inside a bar gets the drop line; one on a bar line relies on
    // the bar line, so no change has two vertical lines side by side.
    const guideChanges = [].slice.call(doc().querySelectorAll('.sheet.chords-grid .grid-change'));
    const guideMid = guideChanges.filter(ch => ch.classList.contains('grid-change-mid'));
    ok('a change inside a bar carries a drop line', guideMid.length > 0,
        guideMid.length + ' of ' + guideChanges.length);
    const guideDouble = guideChanges.filter(ch => {
        const atStart = parseFloat(ch.style.left) <= 6;
        return atStart === ch.classList.contains('grid-change-mid');
    });
    ok('a change is not marked by both a bar line and a drop line',
        guideDouble.length === 0, guideDouble.length + ' doubled');
    // One lyric line per chord change: each change carries exactly its phrase,
    // so a column is never empty and a chord never gets two lines. Words split
    // across changes ("West Vir" at G, "ginia" at D) appear on their own rows
    // at their own x, so you can tell exactly which syllable each chord change
    // lands on. Changes with no following text get an empty row at their x.
    ok('complete song lays out one lyric row per chord change',
        doc().querySelectorAll('.sheet.chords-grid .grid-lyric').length === 57,
        doc().querySelectorAll('.sheet.chords-grid .grid-lyric').length);
    ok('complete song reports the first matched section',
        thInfo && thInfo.lyricSection === 'Verse 1', thInfo && thInfo.lyricSection);
    const thFirst = doc().querySelector('.sheet.chords-grid .grid-lyric');
    ok('complete song first lyric is the first chord phrase',
        !!thFirst && thFirst.textContent === 'Almost heaven,',
        thFirst && thFirst.textContent);
    // Each phrase starts on its change's x: "West Virginia" sits under Em,
    // not at the row's left edge.
    const thRows = doc().querySelectorAll('.sheet.chords-grid .grid-lyric');
    const thSecond = thRows[1];
    const thFirstSystem = doc().querySelector('.sheet.chords-grid .grid-system');
    const thChanges = thFirstSystem ? thFirstSystem.querySelectorAll('.grid-change') : [];
    ok('complete song aligns each phrase with its chord change',
        !!thSecond && !!thChanges[1] &&
        Math.abs(thSecond.getBoundingClientRect().left -
                 thChanges[1].getBoundingClientRect().left) < 1,
        thSecond && thChanges[1] &&
        (thSecond.getBoundingClientRect().left -
         thChanges[1].getBoundingClientRect().left).toFixed(1));
    ok('second phrase is "West Virginia", whole across the Em change',
        !!thSecond && thSecond.textContent === 'West Virginia',
        thSecond && thSecond.textContent);

    // No-grid fallback: the mode stays set, the button is disabled, and the
    // normal sheet renders instead of an empty view.
    win().location.hash = '#/krakow-ukulele/riptide';
    await wait(350);
    ok('mode stays set on a song with no grid', win().songbookTest.getChordMode() === 'grid',
        win().songbookTest.getChordMode());
    ok('grid button disabled on a song with no grid', gridBtn().disabled === true);
    ok('no grid chart rendered for a song with no grid', !gridSheet());
    ok('normal sheet rendered instead',
        doc().querySelectorAll('#sheet .line').length > 0 &&
        $('sheet').textContent.trim().length > 0);
    ok('song with no grid cannot strand the user in an empty view',
        $('sheet').textContent.trim().length > 0, $('sheet').textContent.trim().length);

    win().location.hash = '#/popular/riptide';
    await wait(350);
    ok('mode resumes on the next grid song',
        !!gridSheet() && gridBtn().disabled === false);

    // leave the suite with no sticky grid state
    win().songbookTest.setChordMode('inline');
    await wait(60);
    win().localStorage.removeItem('songbook:chordMode');
    win().localStorage.removeItem('songbook:bpm:popular\u0000riptide');

    // 21. no console/page errors overall
    ok('no page errors', errors.length === 0, errors.join('; '));

    // done
    const fails = log.filter(l => l.startsWith('FAIL'));
    log.push('ERRORS: ' + (errors.join('; ') || 'none'));
    document.title = 'DONE ' + (log.length - fails.length - 1) + '/' + (log.length - 1);
    emit();
    window.__done = true;
}

const logEl = document.getElementById('log');
function emit() {
    logEl.textContent = log.join('\n') + (window.__err ? '\n\nCRASH: ' + window.__err : '');
}

main().catch(e => {
    window.__err = e.message + ' @ ' + (e.stack || '').split('\n')[1];
    document.title = 'CRASH';
    emit();
    window.__done = true;
});
</script>
</body>
</html>
