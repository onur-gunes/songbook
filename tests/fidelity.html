    const want = c.want.map(norm).filter(Boolean);
    const missing = want.filter(l => l.length > 3 && gotFlat.indexOf(l) === -1);
    out.push((missing.length===0?'PASS ':'FAIL ')+c.id+' rendered='+lines0.length+' orig='+want.length+' missing='+missing.length+(missing.length?' :: '+JSON.stringify(missing.slice(0,2)):''));
    // transpose: same line count, label changes, roundtrip identical
    d().getElementById('trUp').click(); await wait(70);
    const t1 = d().getElementById('trValue').textContent==='+1' && d().querySelectorAll('#sheet .line').length===lines0.length;
    out.push((t1?'PASS ':'FAIL ')+c.id+' transpose-rerender');
    d().getElementById('trDown').click(); await wait(70);
    out.push((sheetLines().join('\n')===lines0.join('\n')?'PASS ':'FAIL ')+c.id+' transpose-roundtrip');
  }
  const fails = out.filter(l=>l.startsWith('FAIL')).length;
  document.title = fails===0 ? 'DONE' : 'FAILS:'+fails;
  document.getElementById('log').textContent = out.join('\n');
  window.__done = true;
}
main().catch(e=>{ window.__done = true; document.title='CRASH'; document.getElementById('log').textContent = 'CRASH '+e.message; });
</script>
