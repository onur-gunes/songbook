name: Tests

on:
  pull_request:
  workflow_dispatch:
  # Called by deploy-pages.yml so a push to main must pass the suites
  # before it is allowed to deploy.
  workflow_call:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # ubuntu-latest runners ship Chrome; cdp.py finds it on PATH.
      CHROME_NO_SANDBOX: '1'
      BASE_URL: http://localhost:8777
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install test dependencies
        run: python3 -m pip install --upgrade websocket-client

      - name: Show Chrome version
        run: |
          google-chrome --version || chromium --version

      # tests/env.py and tests/strum.py compare the JS copies of constants and
      # patterns under node; fail here rather than silently skipping them.
      - name: Show Node version
        run: node --version

      - name: Serve the app
        run: |
          python3 -m http.server 8777 >/tmp/http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null "$BASE_URL/index.html"; then
              echo "server up"; exit 0
            fi
            sleep 1
          done
          echo "server failed to start"; cat /tmp/http.log; exit 1

      # --- unit / parser tests (no browser) ---
      - name: ChordPro parser + builder tests
        run: python3 tests/chordpro.py

      - name: Dev/prod environment split
        run: python3 tests/env.py

      # Guards the chordpro.py <-> js/strum.js duplication. Nothing else in
      # CI compares the two copies: a divergence would otherwise ship, since
      # the reproducible-build check only covers generated artefacts.
      - name: Strum library mirror + musical invariants
        run: python3 tests/strum.py

      # Guards the per-song edit plan (issue #105): serialization, migration
      # and the beat > bar > section > song > manual-default precedence.
      - name: Per-song edit plan unit tests
        run: python3 tests/plan.py

      # --- browser suites ---
      - name: Chord engine unit tests
        run: python3 tests/run_html.py "$BASE_URL/tests/chordkit.html"

      - name: App smoke tests
        run: python3 tests/smoke.py "$BASE_URL"

      - name: Empty-state boot (zero songbooks)
        run: python3 tests/empty.py "$BASE_URL"

      - name: Import / IndexedDB tests
        run: python3 tests/import.py "$BASE_URL"

      - name: Tuner tests
        run: python3 tests/tuner.py "$BASE_URL"

      - name: Full behaviour suite
        run: python3 tests/run_html.py "$BASE_URL/tests/e2e.html"

      # Fidelity (all songs of a book) is a local authoring tool, not a CI
      # suite: it needs a copy of the retired legacy/ archive and a matching
      # local songbooks/krakow-ukulele.json. See "Run the tests" in README.md.
      # - name: Fidelity — all songs of the demo book
      #   run: python3 tests/run_html.py "$BASE_URL/tests/fidelity.html"

      # --- builds must succeed and stay reproducible ---
      # Rebuild the shipped book from its ChordPro sources first: this runs
      # validate_songbook()/validate_grid() and makes the drift check below
      # cover songbooks/demo.json too, not just the single-file/Pages output.
      - name: Rebuild ChordPro books
        run: python3 build_songbook.py chordpro/demo

      - name: Build portable single file
        run: python3 build_single.py

      - name: Build Pages site
        run: python3 build_pages.py

      # Songbook.html and songbooks/*.json are committed, so a build that
      # changes them means the tree was pushed out of sync with its sources.
      # (_site/ is gitignored and so never shows up here.)
      - name: Builds are reproducible (no uncommitted drift)
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Build output differs from committed files:"
            git status --porcelain
            git diff
            exit 1
          fi
          echo "working tree clean"
